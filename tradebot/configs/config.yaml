# tradebot configuration. Every value here overrides the built-in default.
# Risk settings are enforced by deterministic code; Claude cannot change them.

# Trading universe: liquid ETFs and large caps (whole-share limit orders).
# NOTE: a fixed list of today's winners creates survivorship bias in backtests.
universe:
  - SPY
  - QQQ
  - IWM
  - DIA
  - XLK
  - XLF
  - XLE
  - XLV
  - XLY
  - XLP
  - XLI
  - XLU
  - XLB
  - SMH
  - GLD
  - TLT
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - AVGO
  - TSLA
  - JPM
  - V
  - MA
  - UNH
  - LLY
  - XOM
  - COST
  - HD
  - NFLX
  - AMD
  - CRM
  - ORCL
  - ADBE
  - PEP
  - KO
  - WMT
  - BAC
  - CAT
benchmark: SPY        # regime filter and performance benchmark
defensive: SGOV       # momentum sleeve holds this in risk-off regimes ("" = cash). SGOV starts 2020-06; use BIL for longer backtests.

strategy:
  regime_sma: 200     # risk-on when benchmark is above its 200-day SMA
  regime_band: 0.01   # 1% hysteresis to avoid whipsaws
  momentum:
    weight: 0.6       # share of capital for the trend sleeve
    top_n: 5
    lookbacks: [63, 126, 252]   # 3, 6, 12 months
    skip: 21                    # skip the most recent month (short-term reversal)
    vol_window: 63
    rebalance_days: 21          # monthly
    trend_sma: 100              # only buy names above their 100-day SMA
    trail_atr_mult: 3.0         # chandelier stop: 3 ATR below the high since entry
    atr_window: 20
  mean_reversion:
    weight: 0.4
    max_positions: 4
    rsi_period: 2
    entry_rsi: 10               # buy when RSI(2) < 10 ...
    trend_sma: 200              # ... and the stock is above its 200-day SMA
    exit_sma: 5                 # sell when close > 5-day SMA
    max_hold_days: 10
    stop_atr_mult: 2.5
    atr_window: 20
    require_risk_on: true
  target_vol: 0.18              # scale down when ex-ante portfolio vol > 18%/yr ("medium risk")
  vol_window: 63
  max_symbol_weight: 0.25
  min_price: 5
  min_dollar_volume: 20000000   # 20-day average dollar volume
  liquidity_window: 20

execution:
  entry_limit_bps: 30           # buy limit = reference price + 0.30%
  exit_limit_bps: 100           # sell limit = reference price - 1.00% (exits should fill)
  rebalance_band: 0.02          # ignore resizes smaller than 2% of equity
  allow_fractional: false
  min_order_notional: 25

risk:
  max_position_weight: 0.30
  max_gross_exposure: 1.0       # never uses margin
  max_orders_per_run: 20
  max_turnover_per_run: 1.2
  daily_loss_limit: 0.04        # no new buys after a 4% down day
  soft_drawdown: 0.15           # halve exposure at 15% drawdown
  soft_drawdown_scale: 0.5
  hard_drawdown: 0.25           # kill switch at 25% drawdown (needs `tradebot resume`)
  max_price_deviation_bps: 150
  max_data_age_days: 5
  deny_symbols: []
  halt_allows_exits: true       # when halted, sell to cash; set false to freeze entirely

backtest:
  initial_equity: 10000
  slippage_bps: 5
  risk_free_rate: 0.0
  start: ""
  end: ""

llm:
  enabled: true
  model: claude-opus-5
  effort: medium
  review_new_entries: true
  on_error: skip                # fail closed: if Claude is unavailable, skip new entries
  max_calls_per_run: 10
  news_lookback_days: 7
  max_headlines: 10
  api_key_env: ANTHROPIC_API_KEY

alpaca:
  key_env: APCA_API_KEY_ID
  secret_env: APCA_API_SECRET_KEY
  data_feed: sip                # historical bars (free plan: SIP older than 15 minutes)
  price_feed: iex               # latest prices (free plan: IEX)
  data_base_url: https://data.alpaca.markets
  trading_base_url: https://paper-api.alpaca.markets   # paper only; live goes through Robinhood

robinhood:
  claude_bin: claude
  executor_dir: deploy/robinhood-executor
  mcp_server: robinhood-trading
  timeout_minutes: 10
  intent_ttl_minutes: 30
  price_tolerance_bps: 50
  # Tool classification for the PreToolUse guard. Verify against the real tool
  # names (run `/mcp` in Claude Code) before going live; unknown tools are denied.
  order_tool_keywords: [place, submit, create_order, buy, sell]
  read_tool_keywords: [get, list, search, quote, portfolio, position, holding, balance, status]
  deny_keywords: [transfer, withdraw, deposit, bank, cancel, close_all, liquidate, option, crypto, margin, setting, update, delete, disconnect]
  fields:
    symbol: [symbol, ticker, instrument_symbol]
    side: [side, action, direction]
    quantity: [quantity, qty, shares]
    limit_price: [limit_price, price, limit]
    order_type: [order_type, type]
  forbidden_input_keys: [strike, strike_price, expiration, expiration_date, option_type, legs, notional, dollar_amount, amount_in_dollars, stop_price, trail_amount]
  # Direct MCP client (no LLM in the order path; required for intraday).
  # 1) tradebot rh-login   2) tradebot rh-tools   3) fill in the exact names below   4) tradebot doctor
  native:
    server_url: https://agent.robinhood.com/mcp/trading
    token_file: oauth_token.json      # stored 0600 under state/robinhood-native/
    callback_port: 3142
    client_name: tradebot
    call_timeout_sec: 15
    account_tool: ""                  # e.g. the portfolio/account summary tool
    positions_tool: ""                # "" if the account tool already lists positions
    place_order_tool: ""              # the equity order tool (must match order_tool_keywords)
    order_status_tool: ""
    cancel_order_tool: ""
    numbers_as_strings: false
    order_args:                       # our field -> the tool's argument name
      symbol: symbol
      side: side
      quantity: quantity
      limit_price: limit_price
      order_id: order_id              # argument name for status/cancel tools
    fixed_args:                       # constant arguments added to every order
      type: limit
      time_in_force: gfd
    result_keys:                      # where to find values in tool results (searched recursively)
      equity: [equity, total_equity, portfolio_value, total_value]
      cash: [cash, cash_available, buying_power, cash_balance]
      positions: [positions, holdings]
      symbol: [symbol, ticker]
      quantity: [quantity, qty, shares]
      avg_price: [average_price, average_buy_price, avg_price, cost_basis_per_share]
      order_id: [order_id, id]
      status: [status, state]
      filled: [filled_quantity, cumulative_quantity, filled_qty]
      fill_price: [average_fill_price, average_price, filled_avg_price, price]

notify:
  webhook_url_env: TRADEBOT_WEBHOOK_URL   # optional Slack-compatible incoming webhook

# Short-term mode: `tradebot day` (opening-range breakout, always flat by the close).
# Run ONE mode per account, or give the two modes disjoint universes.
intraday:
  universe: []                  # empty = the universe above (liquid names only; ETFs rarely come "in play")
  opening_range_minutes: 5
  rvol_lookback_days: 14        # relative volume = today's OR volume / 14-day average OR volume
  min_rvol: 1.0
  top_n_in_play: 10
  min_atr_dollars: 0.5
  atr_days: 14
  min_price: 5
  stop_atr_fraction: 0.10       # stop = entry - 10% of daily ATR
  breakeven_at_r: 0             # 0 = off; e.g. 1.0 moves the stop to entry after +1R
  take_profit_r: 0              # 0 = hold winners to the close
  risk_per_trade: 0.01          # lose at most 1% of equity if the stop is hit
  max_positions: 4
  max_position_weight: 0.25     # max_positions x weight <= 1 (no leverage)
  max_trades_per_day: 8
  no_entries_after: "15:00"     # New York time
  flatten_at: "15:55"
  daily_loss_limit: 0.02        # flatten and stop for the day at -2%
  day_trade_limit_5d: 0         # 0 = unlimited (FINRA removed the $25k PDT rule; set 3 if your broker still enforces it)
  account_type: cash            # cash: buys use settled cash only; margin: still no leverage
  entry_limit_bps: 10           # buy limit = breakout level + 0.10%
  exit_limit_bps: 30            # sell limit = last price - 0.30%
  slippage_bps: 3               # backtest cost per side
  poll_seconds: 2               # price polling interval (Alpaca free tier: 200 requests/min)
  max_quote_age_seconds: 10     # older quotes never trigger trades
  order_timeout_seconds: 20     # cancel unfilled orders after this
  premarket_review: true        # one batched Claude news review at ~09:15 ET
  news_lookback_hours: 18

state_dir: state
