name: tradebot

on:
  push:
    paths: ["tradebot/**", ".github/workflows/tradebot.yml"]
  pull_request:
    paths: ["tradebot/**", ".github/workflows/tradebot.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradebot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tradebot/go.mod
          cache-dependency-path: tradebot/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Synthetic smoke backtest
        run: make synth-backtest
